<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashaduzzaman Faruque | Ostad Assignment</title>
  <style>
    :root { --black: #090c0a; --green: #a4d65e; --ivory: #f5f2e8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--black); color: var(--ivory); }
    .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; position: relative; text-align: center; }
    .line { width: 80px; height: 4px; background: var(--green); border-radius: 4px; margin: 0 auto 26px; }
    h1 { margin: 0; font-size: clamp(2.3rem, 6vw, 5.5rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1.12; }
    h1 span { color: var(--green); }
    .subtitle { margin-top: 20px; color: var(--ivory); opacity: .7; font-size: clamp(.9rem, 1.7vw, 1.1rem); letter-spacing: .22em; text-transform: uppercase; }
    footer { position: absolute; bottom: 35px; left: 15px; right: 15px; color: var(--green); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="page">
    <section>
      <div class="line"></div>
      <h1>Ashaduzzaman <span>Faruque</span></h1>
      <p class="subtitle">Node.js DevOps Demo</p>
    </section>
    <footer>Ostad Assignment</footer>
  </main>
</body>
</html>
